name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Release build
        run: cargo build --release --verbose

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # pretty drag-to-Applications layout; package.sh falls back to hdiutil
      - name: Install create-dmg
        run: brew install create-dmg

      - name: Package macclean.app + dmg
        run: scripts/package.sh

      - name: Upload dmg to release
        uses: softprops/action-gh-release@v2
        with:
          files: target/dist/macclean-macos-arm64.dmg

      # updates ranb27/homebrew-tap's Casks/macclean.rb when the secret exists
      - name: Update homebrew tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: scripts/update_tap.sh "${{ github.ref_name }}" target/dist/macclean-macos-arm64.dmg
